<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Admin Login - Traffic-X</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000; color: #f5f5f7; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative;
        }
        .bg-glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(10, 132, 255, 0.15) 0%, rgba(0,0,0,0) 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; filter: blur(50px); }
        .glass-card { position: relative; z-index: 1; background: rgba(28, 28, 30, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; padding: 48px 32px; max-width: 400px; width: 85%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); opacity: 0; transform: translateY(20px); animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.5px; }
        input { width: 100%; padding: 16px; margin-bottom: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: #fff; font-size: 17px; outline: none; transition: 0.2s; }
        input:focus { border-color: #0a84ff; background: rgba(10,132,255,0.05); }
        .btn { display: block; width: 100%; padding: 16px; background: #0a84ff; color: #fff; text-decoration: none; border-radius: 14px; font-size: 17px; font-weight: 600; transition: transform 0.1s ease; border: none; cursor: pointer; }
        .btn:active { background: #0071e3; transform: scale(0.97); }
        .error { color: #ff453a; margin-bottom: 16px; font-size: 14px; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="glass-card">
        <h1>Admin Access</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST" action="/admin/login">
            <input type="password" name="password" placeholder="Enter Admin Password" required autofocus>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</body>
</html>
