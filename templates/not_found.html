<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Not Found - Traffic-X</title>
    <style>
        /* === iOS-Inspired Styling === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient background glow */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(10, 132, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: blur(50px);
        }

        /* Glassmorphism Card */
        .glass-card {
            position: relative;
            z-index: 1;
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 48px 32px;
            max-width: 400px;
            width: 85%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            
            /* Entrance Animation */
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Animated Search/Warning Icon */
        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: rgba(255, 69, 58, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 69, 58, 0.2);
        }

        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            stroke: #ff453a; /* iOS Red */
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            
            /* Subtle infinite pulse */
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 15px;
            line-height: 1.5;
            color: #8e8e93; /* iOS Secondary Label */
            margin-bottom: 16px;
        }

        .user-input {
            display: inline-block;
            color: #0a84ff; /* iOS Blue */
            font-weight: 600;
            background: rgba(10, 132, 255, 0.1);
            padding: 4px 12px;
            border-radius: 8px;
            margin-top: 4px;
            word-break: break-all;
            max-width: 100%;
        }

        /* iOS Style Button */
        .btn-back {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 16px;
            background: #0a84ff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            transition: transform 0.1s ease, background 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-back:active {
            background: #0071e3;
            transform: scale(0.97); /* iOS press effect */
        }

        /* Keyframe Animations */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.92); opacity: 0.8; }
        }

        /* Responsive tweaks for small phones */
        @media (max-width: 360px) {
            .glass-card {
                padding: 36px 24px;
                width: 92%;
            }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="glass-card">
        <div class="icon-wrapper">
            <!-- Minimalist Search/Alert SVG -->
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <line x1="11" y1="8" x2="11" y2="12"></line> <!-- Exclamation mark line -->
                <circle cx="11" cy="15" r="0.5" fill="#ff453a" stroke="none"></circle> <!-- Exclamation dot -->
            </svg>
        </div>
        
        <h1>No Results Found</h1>
        
        <p>We couldn't find any data for:<br><span class="user-input">{{ user_input }}</span></p>
        <p style="font-size: 13px; margin-top: 8px;">Please check the Email or ID and try again.</p>

        <!-- TELEGRAM BANNER PLACED INSIDE THE GLASS CARD -->
        {% if tg_bot_link %}
        <div style="background: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%); padding: 14px; border-radius: 14px; margin-top: 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);">
            <div style="flex: 1; text-align: left;">
                <strong style="color: #fff; font-size: 14px; display: block;">🔔 Get Alerts!</strong>
                <p style="color: rgba(255,255,255,0.8); font-size: 11px; margin: 2px 0 0;">Never let your VPN expire.</p>
            </div>
            <a href="{{ tg_bot_link }}" target="_blank" style="background: #fff; color: #0a84ff; padding: 8px 14px; border-radius: 10px; text-decoration: none; font-weight: 700; white-space: nowrap; font-size: 13px;">
                Start Bot
            </a>
        </div>
        {% endif %}
        
        <a href="/" class="btn-back">Back to Search</a>
    </div>

</body>
</html>
