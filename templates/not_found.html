<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found - Traffic-X</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid #334155;
        }
        .icon {
            font-size: 48px;
            color: #f87171; /* Red */
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #f1f5f9;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .user-input {
            color: #60a5fa;
            font-weight: bold;
            word-break: break-all;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <h1>User Not Found</h1>
        <p>We couldn't find any data for:<br><span class="user-input">{{ user_input }}</span></p>
        <p>Please check the Email or ID and try again.</p>
        <a href="/" class="btn">Go Back to Search</a>
    </div>
</body>
</html>
